name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # 自动判断子路径：
      #   仓库叫 personal-site            -> 站点在 https://<user>.github.io/personal-site/  -> basePath = /personal-site
      #   仓库叫 <user>.github.io         -> 站点在 https://<user>.github.io/              -> basePath = 空
      # 之后绑自定义域名（如 skyvault.eu.org）时，站点变成根路径提供，basePath 也要空：
      #   把下面的步骤删掉，改成 NEXT_PUBLIC_BASE_PATH: ''
      - id: basepath
        run: |
          NAME="${{ github.event.repository.name }}"
          if [[ "$NAME" == *.github.io ]]; then
            echo "path=" >> "$GITHUB_OUTPUT"
          else
            echo "path=/$NAME" >> "$GITHUB_OUTPUT"
          fi

      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.basepath.outputs.path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
